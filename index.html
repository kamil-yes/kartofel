<!DOCTYPE html>
<html>
    <head>
        <title>Kartofel</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
        <style>
            @font-face {
                font-family: press-start;
                src: url(assets/font.ttf);
            }

            html, body {
                height: 100vh;
            }
            body {
                width: 177.77vh;
                margin: 0 auto;
                background: url(assets/background.jpg);
                background-size: cover;
                font-family: press-start;
                display: flex;
                justify-content: center;
                align-items: flex-end;
                padding-bottom: 9.5vh;
                box-sizing: border-box;
                color: #ffffff;
            }

            .arena-frame {
                width: 68.5%;
                background-image: url('assets/dark_oak_planks.png');
                background-repeat: repeat;
                image-rendering: pixelated;
                padding: 5px;
                box-shadow: 0px 12px 30px rgba(0,0,0,0.8), inset 0 0 10px rgba(0,0,0,0.5);
            }

            .arena-table-container {
                background-image: url('assets/oak_planks.png');
                background-repeat: repeat;
                image-rendering: pixelated;
                padding: 5px;
                box-shadow: inset 4px 4px 0px #4a3625, inset -4px -4px 0px #8c6c51;
            }

            .arena-table {
                width: 100%;
                border-collapse: collapse;
                text-align: center;
                font-size: 5.5px;
                line-height: 1.5;
            }

            .arena-table th {
                border: 3px solid #31241a;
                padding: 10px 2px;
                font-weight: normal;
                color: #ffffff;
                text-shadow: 2px 2px 0px #000000;
                vertical-align: middle;
            }

            .arena-table th:first-child {
                font-size: 12px;
            }

            .arena-table th .icon-num {
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 5px;
                font-size: 14px;
                margin-bottom: 6px;
                color: #ffffff;
            }

            .arena-table td {
                border: 3px solid #31241a;
                height: 31px;
                text-shadow: 2px 2px 0px #000000;
            }

            .arena-table td:first-child {
                text-align: left;
                font-size: 13px;
                color: #ffffff;
                padding-left: 20px;
            }

            .arena-table td:first-child::before {
                content: "🥔";
                display: inline-block;
                font-size: 14px;
                margin-right: 12px;
                vertical-align: middle;
            }

            .arena-table tr:hover td {
                background-color: rgba(255, 255, 255, 0.05);
            }

            td {
                font-size: 20px;
            }
        </style>
    </head>
<body>

    <div class="arena-frame">
        <div class="arena-table-container">
            <table class="arena-table">
                <thead>
                    <tr>
                        <th style="width: 25.4%;">УЧАСТНИКИ</th>
                        <th style="width: 14.8%;"><span class="icon-num">⚔️ 1</span>СКОЛЬКО ИГР<br>СЫГРАНО<br>НА ПЕРВОМ<br>НАБОРЕ</th>
                        <th style="width: 14.8%;"><span class="icon-num">⚔️ 2</span>СКОЛЬКО ИГР<br>СЫГРАНО<br>НА ВТОРОМ<br>НАБОРЕ</th>
                        <th style="width: 15%;"><span class="icon-num">🏆 3</span>КОЛИЧЕСТВО<br>ПОБЕД</th>
                        <th style="width: 15%;"><span class="icon-num">🛡️ 4</span>КОЛИЧЕСТВО<br>ПОРАЖЕНИЙ</th>
                        <th style="width: 15%;"><span class="icon-num">⭐ 5</span>ОЧКИ</th>
                    </tr>
                </thead>
                <tbody>
                </tbody>
            </table>
        </div>
    </div>

    <script>

        function parse_battles(data, participants, type) {
            data[type].forEach(battle => {
                if(battle[2] != battle[0] && battle[2] != battle[1]) throw new Error(`Wrong winner (${participants[battle[0]].name} vs ${participants[battle[1]].name}, ${type} battle)`)

                participants[battle[0]][type]++
                participants[battle[0]][battle[0] == battle[2] ? "victories" : "losses"]++

                participants[battle[1]][type]++
                participants[battle[1]][battle[1] == battle[2] ? "victories" : "losses"]++
            })
        }

        const tbody = document.querySelector("tbody")
        fetch('data.json')
            .then(res => res.json())
            .then(data => {
                let participants = []
                data.participants.forEach(p =>  participants.push({name: p, first_kit: 0, second_kit: 0, victories: 0, losses: 0}))
                parse_battles(data, participants, "first_kit")
                parse_battles(data, participants, "second_kit")
                participants.forEach(p => tbody.innerHTML += `<tr><td>${p.name}</td><td>${p.first_kit}</td><td>${p.second_kit}</td><td>${p.victories}</td><td>${p.losses}</td><td>${p.victories*2}</td></tr>`)
            })
            .catch(err => alert('Ошибка: ' + err.message))

    </script>

</body>
</html>
